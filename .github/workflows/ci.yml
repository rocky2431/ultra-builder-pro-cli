name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly sanity run — catches upstream runtime / SDK drift.
    - cron: '0 3 * * 1'

jobs:
  release-gate:
    name: Release gate (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Configure git identity (needed for worktree tests)
        run: |
          git config --global user.email "ci@ubp.dev"
          git config --global user.name "ubp-ci"
          git config --global init.defaultBranch main
      - run: npm ci
      - run: python -m pip install pytest==8.4.2
      - run: npm run verify:release

  windows-acp-cleanup:
    name: Windows ACP descendant cleanup (Node 22)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Configure git identity (needed for worktree tests)
        run: |
          git config --global user.email "ci@ubp.dev"
          git config --global user.name "ubp-ci"
          git config --global init.defaultBranch main
          git config --global core.autocrlf false
      - run: npm ci
      - name: Exercise real Windows ACP cancellation and timeout cleanup
        run: node --test tests/acp-driver.test.cjs tests/acp-conformance.test.cjs
