# Ultra Builder Pro — MCP tool contracts
# Single source for tool name, schema, errors, and CLI mapping.
# Validated by spec/schemas/mcp-tools.schema.json (run `npm run test:spec`).
# Trace: PLAN §7.3, decisions D12 / D29 / D31-D34.

version: '1.2'

info:
  title: Ultra Builder Pro MCP tool contracts
  phase: '1.2'
  trace_to: 'PLAN docs/PLAN.zh-CN.md §7.3'
  notes: |
    This published contract contains only tools registered by the MCP server.
    Host-native review, impact, skill discovery, and human-interaction capabilities
    are documented by each adapter's capability map rather than advertised as MCP.
    Generators consume this YAML to derive types, validators, and CLI parsers (R19).
    cli_subcommand values reserve stable names; runtime availability is defined by
    ultra-tools <family> --help. Task lifecycle skills use MCP and fail closed.
    Adding a tool requires: (a) update this file, (b) add valid+invalid
    fixture to spec/fixtures/{valid,invalid}/, (c) `npm run test:spec` green.

families:
  - { name: task,    description: 'authoritative task lifecycle on state.db', phase: '2' }
  - { name: session, description: 'execution-unit lifecycle with single-active-lease admission (D33)', phase: '4.5' }
  - { name: plan,    description: 'execution-plan artifact export and query (D34)', phase: '8a' }
  - { name: baseline, description: 'project adoption, baseline evidence, convergence, and drift authority', phase: '11' }
  - { name: change,  description: 'continuous post-delivery change lifecycle and convergence', phase: '9' }
  - { name: system,  description: 'read-only diagnostics and explicit backup-first repair', phase: '9' }

tools:

  # ─────────────────────────── task family ────────────────────────────────
  - name: task.create
    family: task
    description: Create a new task in state.db. Emits task_created event. If `id` is omitted the server mints a uuid. Child tasks inherit the parent's change ownership; conflicting ownership is rejected.
    phase: '2'
    writer_role: mcp
    input_schema:
      type: object
      required: [title, type, priority]
      additionalProperties: false
      properties:
        id:             { type: string, pattern: '^[a-zA-Z0-9_\-]+$', description: 'optional caller-supplied id; otherwise server mints a uuid' }
        title:          { type: string, minLength: 3 }
        type:           { type: string, enum: [architecture, feature, bugfix] }
        priority:       { type: string, enum: [P0, P1, P2, P3] }
        complexity:     { type: integer, minimum: 1, maximum: 10 }
        estimated_days: { type: number, exclusiveMinimum: 0, description: 'estimated implementation effort in days' }
        deps:           { type: array, items: { type: string } }
        files_modified: { type: array, items: { type: string }, description: 'Phase 8A conflict detection' }
        parent_id:      { type: string, description: 'Phase 8A.3 parent reference; the child inherits this task change ownership' }
        tag:            { type: string, description: 'git branch tag (Phase 7.2)' }
        trace_to:       { type: string, description: 'spec anchor (e.g. spec/mcp-tools.yaml#task.create)' }
        change_id:      { type: string, pattern: '^[a-zA-Z0-9_\-]+$', description: 'active or blocked continuous change unit owning this task; inherited from parent_id when omitted' }
    output_schema:
      type: object
      required: [id, status, created_at]
      additionalProperties: false
      properties:
        id:         { type: string, pattern: '^[a-zA-Z0-9_\-]+$' }
        status:     { type: string, enum: [pending] }
        created_at: { type: string, format: date-time }
    errors:
      - { code: VALIDATION_ERROR, description: 'input failed schema validation' }
      - { code: DUPLICATE_TASK_ID, description: 'task id already exists' }
      - { code: TASK_NOT_FOUND, description: 'parent task does not exist' }
      - { code: CHANGE_NOT_FOUND, description: 'assigned change does not exist' }
      - { code: CHANGE_NOT_MUTABLE, description: 'assigned change no longer accepts tasks' }
      - { code: TASK_CHANGE_OWNERSHIP_MISMATCH, description: 'child ownership conflicts with its parent change' }
      - { code: BASELINE_NOT_READY, description: 'ordinary task creation requires a ready baseline or an already-authorized active change' }
      - { code: LEGACY_STATE_MIGRATION_REQUIRED, description: 'non-empty v4.4 projection must be migrated before state-backed tools can run' }
      - { code: STATE_DB_LOCKED, description: 'database is locked', retriable: true }
    cli_subcommand: task create
    emits_events: [task_created]
    trace_to: '§7.3, §7.1'

  - name: task.update
    family: task
    description: Patch a task's mutable fields. status transitions enforced server-side.
    phase: '2'
    writer_role: mcp
    input_schema:
      type: object
      required: [id, patch]
      additionalProperties: false
      properties:
        id: { type: string }
        patch:
          type: object
          additionalProperties: false
          properties:
            status:        { type: string, enum: [pending, in_progress, completed, blocked, expanded] }
            priority:      { type: string, enum: [P0, P1, P2, P3] }
            complexity:    { type: integer, minimum: 1, maximum: 10 }
            estimated_days: { type: number, exclusiveMinimum: 0 }
            deps:          { type: array, items: { type: string } }
            files_modified: { type: array, items: { type: string } }
            session_id:    { type: string }
            stale:         { type: boolean }
            tag:           { type: string }
            completion_commit: { type: string, pattern: '^[0-9a-f]{7,40}$' }
            change_id:    { type: ['string', 'null'], pattern: '^[a-zA-Z0-9_\-]+$' }
    output_schema:
      type: object
      required: [ok, task]
      additionalProperties: false
      properties:
        ok:   { type: boolean }
        task: { type: object }
    errors:
      - { code: TASK_NOT_FOUND, description: 'no task with given id' }
      - { code: ILLEGAL_STATUS_TRANSITION, description: 'transition rejected by state machine' }
      - { code: VALIDATION_ERROR, description: 'patch failed schema validation' }
      - { code: CHANGE_NOT_FOUND, description: 'assigned change does not exist' }
      - { code: CHANGE_NOT_MUTABLE, description: 'assigned change no longer accepts task updates' }
      - { code: TASK_CHANGE_OWNERSHIP_MISMATCH, description: 'task ownership conflicts with its parent or children' }
      - { code: LEGACY_STATE_MIGRATION_REQUIRED, description: 'non-empty v4.4 projection must be migrated before state-backed tools can run' }
    cli_subcommand: task update
    emits_events: [task_started, task_completed, task_blocked, task_stale_marked]
    trace_to: '§7.3, §7.2'

  - name: task.list
    family: task
    description: List tasks filtered by status / tag / time window.
    phase: '2'
    readonly: true
    writer_role: any
    input_schema:
      type: object
      additionalProperties: false
      properties:
        status: { type: string, enum: [pending, in_progress, completed, blocked, expanded, any] }
        tag:    { type: string }
        since:  { type: string, format: date-time }
        limit:  { type: integer, minimum: 1, maximum: 1000 }
    output_schema:
      type: object
      required: [tasks, count]
      additionalProperties: false
      properties:
        tasks: { type: array, items: { type: object } }
        count: { type: integer, minimum: 0 }
    errors:
      - { code: VALIDATION_ERROR, description: 'filter failed schema validation' }
      - { code: LEGACY_STATE_MIGRATION_REQUIRED, description: 'non-empty v4.4 projection must be migrated before state-backed tools can run' }
    cli_subcommand: task list
    emits_events: []
    trace_to: '§7.3'

  - name: task.get
    family: task
    description: Fetch one task with its full row.
    phase: '2'
    readonly: true
    writer_role: any
    input_schema:
      type: object
      required: [id]
      additionalProperties: false
      properties:
        id: { type: string }
    output_schema:
      type: object
      required: [task]
      additionalProperties: false
      properties:
        task: { type: object }
    errors:
      - { code: TASK_NOT_FOUND, description: 'no task with given id' }
    cli_subcommand: task get
    emits_events: []
    trace_to: '§7.3'

  - name: task.switch_tag
    family: task
    description: Change a task's tag (branch-scoped context partition, Phase 7.2). Emits task_tag_changed.
    phase: '7.2'
    writer_role: mcp
    input_schema:
      type: object
      required: [id, tag]
      additionalProperties: false
      properties:
        id:  { type: string }
        tag: { type: ['string', 'null'] }
    output_schema:
      type: object
      required: [task_id, tag]
      additionalProperties: false
      properties:
        task_id: { type: string }
        tag:     { type: ['string', 'null'] }
        from:    { type: ['string', 'null'] }
    errors:
      - { code: TASK_NOT_FOUND, description: 'no task with given id' }
      - { code: VALIDATION_ERROR, description: 'task_id missing' }
    cli_subcommand: task switch-tag
    emits_events: [task_tag_changed]
    trace_to: '§6, D26'

  - name: task.delete
    family: task
    description: Hard-delete a task. Refuses if any in_progress session is bound.
    phase: '2'
    writer_role: mcp
    input_schema:
      type: object
      required: [id]
      additionalProperties: false
      properties:
        id:    { type: string }
        force: { type: boolean, default: false }
    output_schema:
      type: object
      required: [ok]
      additionalProperties: false
      properties:
        ok: { type: boolean }
    errors:
      - { code: TASK_NOT_FOUND, description: 'no task with given id' }
      - { code: SESSION_ACTIVE, description: 'task has an active session; pass force=true to override' }
    cli_subcommand: task delete
    emits_events: []
    trace_to: '§7.3'

  - name: task.init_project
    family: task
    description: |
      Bootstrap `.ultra/` and start an authoritative greenfield or brownfield
      baseline. Auto mode detects meaningful existing project content before
      copying specification templates and creating state.db.
    phase: '3'
    writer_role: mcp
    input_schema:
      type: object
      required: [target_dir, project_name]
      additionalProperties: false
      properties:
        target_dir:
          type: string
          description: absolute or repo-relative path of the project root where `.ultra/` will be created
        project_name:
          type: string
          minLength: 1
        project_type:
          type: string
          enum: [web, api, cli, fullstack, other]
          description: optional; skill will pass detected value when available
        stack:
          type: string
          description: optional tech stack descriptor (comma-separated for fullstack)
        mode:
          type: string
          enum: [auto, greenfield, brownfield]
          default: auto
          description: auto detects whether meaningful project content already exists
        resume:
          type: boolean
          default: false
          description: preserve an existing `.ultra/`, upgrade its schema, and install only missing current scaffold files
        scope:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, minLength: 1 }
          default: ['.']
          description: project-relative repository roots governed by the initial baseline
        overwrite:
          type: boolean
          default: false
          description: when true, back up an existing `.ultra/` to `.ultra.backup.<ts>` then re-create
        source_template:
          type: string
          description: override path to the template root (defaults to bundled templates/.ultra/)
    output_schema:
      type: object
      required: [created_path, state_db_path, status, mode, baseline, copied_files, repository_profile]
      additionalProperties: false
      properties:
        created_path:
          type: string
          description: absolute path to the created `.ultra/` directory
        state_db_path:
          type: string
          description: absolute path to the initialized authoritative SQLite database
        status:
          type: string
          enum: [created, overwritten, resumed]
        mode:
          type: string
          enum: [greenfield, brownfield]
        baseline:
          type: object
          required: [id, mode, status, scope]
          additionalProperties: true
        copied_files:
          type: array
          items: { type: string }
          description: paths relative to created_path
        repository_profile:
          type: object
          description: bounded classification evidence used to route greenfield or brownfield adoption
        backup_path:
          type: string
          description: set only when status=overwritten
        migration_backup_path:
          type: string
          description: pre-migration database backup created while resuming an older schema
    errors:
      - { code: ULTRA_DIR_EXISTS,  description: '.ultra/ already exists and overwrite=false' }
      - { code: TEMPLATE_MISSING,  description: 'source_template path does not exist' }
      - { code: TARGET_NOT_DIR,    description: 'target_dir is not a directory' }
      - { code: BASELINE_SCOPE_MISSING, description: 'a selected baseline scope does not exist' }
      - { code: LEGACY_STATE_MIGRATION_REQUIRED, description: 'projection-only tasks must be imported before resume' }
      - { code: STATE_AUTHORITY_CONFLICT, description: 'projection tasks and authoritative state cannot be reconciled automatically' }
      - { code: STATE_PROJECTION_INVALID, description: 'the existing task projection is malformed' }
      - { code: IO_ERROR,          description: 'filesystem write failed', retriable: true }
    cli_subcommand: task init-project
    emits_events: [project_initialized, project_resumed]
    trace_to: 'PLAN §6 Phase 3.1'

  - name: task.expand
    family: task
    description: Expand a parent task into N child sub-tasks (Phase 8A).
    phase: '8a'
    writer_role: mcp
    input_schema:
      type: object
      required: [id]
      additionalProperties: false
      properties:
        id:        { type: string }
        sub_count: { type: integer, minimum: 1, maximum: 16 }
        strategy:  { type: string, enum: [llm], default: llm }
    output_schema:
      type: object
      required: [parent_id, children]
      additionalProperties: false
      properties:
        parent_id: { type: string }
        children:  { type: array, items: { type: object } }
    errors:
      - { code: TASK_NOT_FOUND, description: 'parent id missing' }
      - { code: ALREADY_EXPANDED, description: 'task is already expanded' }
      - { code: CHANGE_NOT_FOUND, description: 'the parent task change does not exist' }
      - { code: CHANGE_NOT_MUTABLE, description: 'the parent task change no longer accepts children' }
      - { code: BASELINE_NOT_READY, description: 'child creation requires a ready baseline or the parent task to belong to an already-authorized active change' }
    cli_subcommand: task expand
    emits_events: [task_expanded]
    trace_to: '§7.3, D34'

  - name: task.parse_prd
    family: task
    description: Parse a PRD document into a task graph (Phase 8A). When dry_run=true the tasks are returned without writing to state.db (supports ultra-plan human gate workflow).
    phase: '8a'
    writer_role: mcp
    input_schema:
      type: object
      additionalProperties: false
      properties:
        prd_path: { type: string }
        prd_text: { type: string }
        tag:      { type: string }
        change_id: { type: string, pattern: '^[a-zA-Z0-9_\-]+$', description: 'continuous change unit that will own every persisted parsed task' }
        dry_run:  { type: boolean, default: false, description: 'when true, do not persist to state.db — used by ultra-plan gate to preview before approve' }
    output_schema:
      type: object
      required: [tasks, topo]
      additionalProperties: false
      properties:
        tasks: { type: array, items: { type: object } }
        topo:  { type: array, items: { type: array, items: { type: string } } }
    errors:
      - { code: NO_INPUT, description: 'one of prd_path or prd_text required' }
      - { code: PARSE_FAILED, description: 'PRD could not be parsed into tasks' }
      - { code: CHANGE_NOT_FOUND, description: 'assigned change does not exist' }
      - { code: CHANGE_NOT_MUTABLE, description: 'assigned change no longer accepts tasks' }
      - { code: BASELINE_NOT_READY, description: 'persisting parsed tasks requires a ready baseline or an already-authorized active change' }
    cli_subcommand: task parse-prd
    emits_events: [task_created]
    trace_to: '§7.3, D34'

  - name: task.dependency_topo
    family: task
    description: Compute topological waves for a set of tasks; consumed by execution-plan.
    phase: '8a'
    readonly: true
    input_schema:
      type: object
      additionalProperties: false
      properties:
        task_ids: { type: array, items: { type: string } }
    output_schema:
      type: object
      required: [waves]
      additionalProperties: false
      properties:
        waves: { type: array, items: { type: array, items: { type: string } } }
        cycles: { type: array, items: { type: array, items: { type: string } } }
    errors:
      - { code: CYCLE_DETECTED, description: 'dependency graph has cycles' }
    cli_subcommand: task topo
    emits_events: []
    trace_to: '§7.3, D34'

  - name: task.append_event
    family: task
    description: Append a row to events table. Returns assigned id (subscribe cursor).
    phase: '2'
    writer_role: any
    input_schema:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        task_id:    { type: string }
        change_id:  { type: string }
        session_id: { type: string }
        runtime:    { type: string, enum: [claude, opencode, codex, kimi] }
        type:
          type: string
          enum:
            - task_created
            - task_started
            - task_completed
            - task_failed
            - task_blocked
            - task_expanded
            - task_stale_marked
            - session_spawned
            - session_closed
            - session_crashed
            - session_orphaned
            - session_heartbeat_lost
            - spec_changed
            - context_updated
            - plan_approved
            - commit_pushed
            - review_verdict
            - merge_conflict
            - auto_merged
            - cost_alert
            - token_alert
            - circuit_open
            - change_created
            - change_updated
            - change_blocked
            - change_converged
            - change_archived
            - spec_learning_proposed
            - spec_learning_resolved
        payload: { type: object }
    output_schema:
      type: object
      required: [event_id, ts]
      additionalProperties: false
      properties:
        event_id: { type: integer, minimum: 1 }
        ts:       { type: string, format: date-time }
    errors:
      - { code: VALIDATION_ERROR, description: 'event payload failed validation' }
      - { code: STATE_DB_LOCKED, description: 'database is locked', retriable: true }
    cli_subcommand: task append-event
    emits_events: []
    trace_to: '§7.2, D31'

  - name: task.subscribe_events
    family: task
    description: Pull events with id > since_id. Cursor is monotonic (D31, R26).
    phase: '2'
    readonly: true
    input_schema:
      type: object
      required: [since_id]
      additionalProperties: false
      properties:
        since_id: { type: integer, minimum: 0 }
        types:    { type: array, items: { type: string } }
        task_id:  { type: string }
        limit:    { type: integer, minimum: 1, maximum: 500, default: 100 }
    output_schema:
      type: object
      required: [events, next_since_id]
      additionalProperties: false
      properties:
        events: { type: array, items: { type: object } }
        next_since_id: { type: integer, minimum: 0 }
    errors:
      - { code: VALIDATION_ERROR, description: 'cursor or filter invalid' }
    cli_subcommand: task subscribe
    emits_events: []
    trace_to: '§7.2, D31'

  # ────────────────────────── session family ──────────────────────────────
  - name: session.spawn
    family: session
    description: Register execution-session intent, lease, and proposed worktree/artifact paths. The orchestrator creates the process and worktree after this admission step.
    phase: '4.5'
    writer_role: mcp
    input_schema:
      type: object
      required: [task_id, runtime]
      additionalProperties: false
      properties:
        task_id:  { type: string }
        runtime:  { type: string, enum: [claude, opencode, codex, kimi] }
        takeover: { type: boolean, default: false, description: 'override active lease (D33 takeover strategy)' }
        worktree_base: { type: string }
    output_schema:
      type: object
      required: [sid, worktree_path, artifact_dir, lease_expires_at]
      additionalProperties: false
      properties:
        sid:               { type: string }
        worktree_path:     { type: string }
        artifact_dir:      { type: string }
        lease_expires_at:  { type: string, format: date-time }
    errors:
      - { code: TASK_NOT_FOUND, description: 'task id missing' }
      - { code: ADMISSION_DENIED, description: 'active lease exists; choose takeover/resume/abandon' }
    cli_subcommand: session spawn
    emits_events: [session_spawned]
    trace_to: '§7.3, D20, D33'

  - name: session.close
    family: session
    description: Close a session and release its lease.
    phase: '4.5'
    writer_role: mcp
    input_schema:
      type: object
      required: [sid, status]
      additionalProperties: false
      properties:
        sid:    { type: string }
        status: { type: string, enum: [completed, crashed, orphan] }
    output_schema:
      type: object
      required: [ok]
      additionalProperties: false
      properties:
        ok: { type: boolean }
    errors:
      - { code: SESSION_NOT_FOUND, description: 'sid unknown' }
    cli_subcommand: session close
    emits_events: [session_closed, session_crashed, session_orphaned]
    trace_to: '§7.3, D32'

  - name: session.get
    family: session
    description: Fetch a session row.
    phase: '4.5'
    readonly: true
    input_schema:
      type: object
      required: [sid]
      additionalProperties: false
      properties:
        sid: { type: string }
    output_schema:
      type: object
      required: [session]
      additionalProperties: false
      properties:
        session: { type: object }
    errors:
      - { code: SESSION_NOT_FOUND, description: 'sid unknown' }
    cli_subcommand: session get
    emits_events: []
    trace_to: '§7.3'

  - name: session.list
    family: session
    description: List sessions filtered by status (default 'running') and optional task_id. Read-only snapshot for /ultra-status + orchestrator dashboards.
    phase: '4.5'
    readonly: true
    input_schema:
      type: object
      additionalProperties: false
      properties:
        status:   { type: string, enum: [running, completed, crashed, orphan] }
        task_id:  { type: string }
        limit:    { type: integer, minimum: 1, maximum: 500, default: 100 }
    output_schema:
      type: object
      required: [sessions, count]
      additionalProperties: false
      properties:
        sessions: { type: array, items: { type: object } }
        count:    { type: integer, minimum: 0 }
    errors:
      - { code: STATE_DB_ERROR, description: 'database unavailable', retriable: true }
    cli_subcommand: session list
    emits_events: []
    trace_to: '§7.3, Phase 4.5.4'

  - name: session.admission_check
    family: session
    description: Check whether spawning a new session for task_id is allowed (D33). Returns recommended action.
    phase: '4.5'
    readonly: true
    input_schema:
      type: object
      required: [task_id]
      additionalProperties: false
      properties:
        task_id: { type: string }
        runtime: { type: string, enum: [claude, opencode, codex, kimi] }
    output_schema:
      type: object
      required: [can_spawn, recommended_action]
      additionalProperties: false
      properties:
        can_spawn:          { type: boolean }
        conflict:
          type: object
          properties:
            sid:          { type: string }
            status:       { type: string }
            heartbeat_age_ms: { type: integer, minimum: 0 }
        recommended_action:
          type: string
          enum: [spawn, takeover, resume, abandon, blocked_by_breaker]
    errors:
      - { code: TASK_NOT_FOUND, description: 'task id missing' }
    cli_subcommand: session admission
    emits_events: []
    trace_to: '§7.3, D33'

  - name: session.heartbeat
    family: session
    description: Refresh lease for a running session. Lease expires after grace period without heartbeat.
    phase: '4.5'
    writer_role: mcp
    input_schema:
      type: object
      required: [sid]
      additionalProperties: false
      properties:
        sid: { type: string }
    output_schema:
      type: object
      required: [ok, lease_expires_at]
      additionalProperties: false
      properties:
        ok:               { type: boolean }
        lease_expires_at: { type: string, format: date-time }
    errors:
      - { code: SESSION_NOT_FOUND, description: 'sid unknown' }
      - { code: LEASE_EXPIRED, description: 'lease already expired; need takeover/resume' }
    cli_subcommand: session heartbeat
    emits_events: [session_heartbeat_lost]
    trace_to: '§7.3, D32'

  - name: session.subscribe_events
    family: session
    description: Pull session-related events with cursor.
    phase: '4.5'
    readonly: true
    input_schema:
      type: object
      required: [since_id]
      additionalProperties: false
      properties:
        since_id: { type: integer, minimum: 0 }
        sid:      { type: string }
        limit:    { type: integer, minimum: 1, maximum: 500, default: 100 }
    output_schema:
      type: object
      required: [events, next_since_id]
      additionalProperties: false
      properties:
        events:        { type: array, items: { type: object } }
        next_since_id: { type: integer, minimum: 0 }
    errors:
      - { code: VALIDATION_ERROR, description: 'cursor invalid' }
    cli_subcommand: session subscribe
    emits_events: []
    trace_to: '§7.3, D31'

  # ───────────────────────── baseline family ─────────────────────────────
  - name: baseline.start
    family: baseline
    description: Start a greenfield baseline or brownfield adoption without overwriting a ready baseline implicitly.
    phase: '11'
    writer_role: mcp
    input_schema:
      type: object
      required: [project_name, mode]
      additionalProperties: false
      allOf:
        - if:
            required: [replace_ready]
            properties: { replace_ready: { const: true } }
          then: { required: [replacement_authorization] }
        - if: { required: [replacement_authorization] }
          then:
            required: [replace_ready]
            properties: { replace_ready: { const: true } }
      properties:
        id: { type: string, pattern: '^[a-zA-Z0-9_\-]+$', default: project-baseline }
        project_name: { type: string, minLength: 1 }
        project_type: { type: string, enum: [web, api, cli, fullstack, other] }
        stack: { type: string }
        mode: { type: string, enum: [greenfield, brownfield] }
        scope: { type: array, minItems: 1, items: { type: string, minLength: 1 }, default: ['.'] }
        repository_revision: { type: string, minLength: 1 }
        replace_ready: { type: boolean, default: false }
        replacement_authorization:
          type: object
          required: [approved_by, reason]
          additionalProperties: false
          properties:
            approved_by: { type: string, minLength: 1 }
            reason: { type: string, minLength: 3 }
        replace_migrated: { type: boolean, default: false, description: explicitly supersede a compatibility-only migrated baseline and start evidence-backed adoption }
        classification: { type: object, description: bounded repository classification evidence; content is limited to 32 KiB }
        provider_refs:
          type: object
          additionalProperties: false
          properties:
            memory:
              type: object
              required: [provider]
              additionalProperties: false
              properties:
                provider: { type: string }
                project: { type: string }
                reference: { type: string }
                revision: { type: string }
                indexed_head: { type: string }
                status: { type: string, enum: [available, unavailable, fresh, stale, unknown] }
            code_graph:
              type: object
              required: [provider]
              additionalProperties: false
              properties:
                provider: { type: string }
                project: { type: string }
                reference: { type: string }
                revision: { type: string }
                indexed_head: { type: string }
                status: { type: string, enum: [available, unavailable, fresh, stale, unknown] }
    output_schema:
      type: object
      required: [baseline]
      additionalProperties: false
      properties:
        baseline: { type: object }
    errors:
      - { code: BASELINE_EXISTS, description: 'a ready baseline requires explicit replacement' }
      - { code: BASELINE_IN_PROGRESS, description: 'another adoption is already active' }
      - { code: BASELINE_REPLACEMENT_AUTHORIZATION_REQUIRED, description: 'ready-baseline replacement lacks durable owner approval and rationale' }
      - { code: BASELINE_REPLACEMENT_INVALID, description: 'replacement flags do not match the current baseline lifecycle or authorization payload' }
      - { code: BASELINE_SCOPE_MISSING, description: 'a selected baseline scope does not exist' }
      - { code: PROVIDER_CONTENT_FORBIDDEN, description: 'provider payload content must remain external' }
    cli_subcommand: baseline start
    emits_events: [baseline_started]

  - name: baseline.record
    family: baseline
    description: Replace the current adoption snapshot with bounded specification digests, evidence references, verification, unknowns, and provider metadata.
    phase: '11'
    writer_role: mcp
    input_schema:
      type: object
      required: [id]
      additionalProperties: false
      properties:
        id: { type: string, pattern: '^[a-zA-Z0-9_\-]+$' }
        repository_revision: { type: string, minLength: 1 }
        scope: { type: array, minItems: 1, items: { type: string, minLength: 1 } }
        spec_refs:
          type: array
          items:
            type: object
            required: [kind, path]
            additionalProperties: false
            properties:
              kind: { type: string, enum: [discovery, product, architecture, quality, delivery, other] }
              path: { type: string, minLength: 1 }
        evidence:
          type: array
          items:
            type: object
            required: [kind, ref, summary]
            additionalProperties: false
            properties:
              kind: { type: string, enum: [source, docs, runtime, test, deploy, external] }
              ref: { type: string, minLength: 1 }
              summary: { type: string, minLength: 1 }
        verification:
          type: array
          items:
            type: object
            required: [name, command, status, evidence]
            additionalProperties: false
            properties:
              name: { type: string, minLength: 1 }
              command: { type: string, minLength: 1 }
              status: { type: string, enum: [pass, known_red, not_run] }
              evidence: { type: string, minLength: 1 }
              rationale: { type: string, minLength: 1 }
        unknowns:
          type: array
          items:
            type: object
            required: [summary, blocking]
            additionalProperties: false
            properties:
              summary: { type: string, minLength: 1 }
              blocking: { type: boolean }
              owner: { type: string, minLength: 1 }
        gaps:
          type: array
          items:
            type: object
            required: [id, category, summary]
            additionalProperties: false
            properties:
              id: { type: string, pattern: '^[a-zA-Z0-9_\-]+$' }
              category: { type: string, enum: [baseline_blocker, documentation_drift, known_defect, technical_debt, unknown, future_change] }
              status: { type: string, enum: [open, accepted, resolved, deferred], default: open }
              blocking: { type: boolean, default: false }
              summary: { type: string, minLength: 1 }
              evidence_refs: { type: array, uniqueItems: true, items: { type: string, minLength: 1 }, default: [] }
              owner: { type: ['string', 'null'], minLength: 1 }
              resolution: { type: string, minLength: 1 }
        classification: { type: object, description: bounded repository classification evidence; content is limited to 32 KiB }
        provider_refs:
          type: object
          additionalProperties: false
          properties:
            memory:
              type: object
              required: [provider]
              additionalProperties: false
              properties:
                provider: { type: string }
                project: { type: string }
                reference: { type: string }
                revision: { type: string }
                indexed_head: { type: string }
                status: { type: string, enum: [available, unavailable, fresh, stale, unknown] }
            code_graph:
              type: object
              required: [provider]
              additionalProperties: false
              properties:
                provider: { type: string }
                project: { type: string }
                reference: { type: string }
                revision: { type: string }
                indexed_head: { type: string }
                status: { type: string, enum: [available, unavailable, fresh, stale, unknown] }
    output_schema:
      type: object
      required: [baseline]
      additionalProperties: false
      properties:
        baseline: { type: object }
    errors:
      - { code: BASELINE_NOT_FOUND, description: 'baseline id does not exist' }
      - { code: BASELINE_NOT_MUTABLE, description: 'ready and superseded baselines are immutable' }
      - { code: BASELINE_SPEC_MISSING, description: 'a declared specification file does not exist' }
      - { code: BASELINE_SCOPE_MISSING, description: 'a selected baseline scope does not exist' }
      - { code: PROVIDER_CONTENT_FORBIDDEN, description: 'provider payload content must remain external' }
    cli_subcommand: baseline record
    emits_events: [baseline_recorded]

  - name: baseline.get
    family: baseline
    description: Read the current or named authoritative baseline with live digest and repository-revision health.
    phase: '11'
    readonly: true
    input_schema:
      type: object
      additionalProperties: false
      properties:
        id: { type: string, pattern: '^[a-zA-Z0-9_\-]+$' }
    output_schema:
      type: object
      required: [baseline, health]
      additionalProperties: false
      properties:
        baseline: { type: object }
        health: { type: object }
    errors:
      - { code: BASELINE_NOT_FOUND, description: 'no matching baseline exists' }
    cli_subcommand: baseline get
    emits_events: []

  - name: baseline.converge
    family: baseline
    description: Approve a baseline only when its revision, specification digests, evidence, verification, and blocking unknowns satisfy deterministic gates.
    phase: '11'
    writer_role: mcp
    input_schema:
      type: object
      required: [id, expected_revision, approved_by, approval_note]
      additionalProperties: false
      properties:
        id: { type: string, pattern: '^[a-zA-Z0-9_\-]+$' }
        expected_revision: { type: string, minLength: 1 }
        approved_by: { type: string, minLength: 1 }
        approval_note: { type: string, minLength: 3 }
        accept_known_red: { type: boolean, default: false }
        accept_dirty_worktree: { type: boolean, default: false, description: explicitly freeze the exact recorded dirty-worktree digest into the baseline }
    output_schema:
      type: object
      required: [ready, status, blockers, baseline]
      additionalProperties: false
      properties:
        ready: { type: boolean }
        status: { type: string, enum: [blocked, ready] }
        blockers: { type: array, items: { type: string } }
        baseline: { type: object }
    errors:
      - { code: BASELINE_NOT_FOUND, description: 'baseline id does not exist' }
      - { code: BASELINE_NOT_CONVERGEABLE, description: 'baseline lifecycle does not allow convergence' }
      - { code: BASELINE_NOT_READY, description: 'baseline evidence, gaps, revision, branch, worktree, or verification still blocks convergence' }
    cli_subcommand: baseline converge
    emits_events: [baseline_blocked, baseline_converged]

  # ────────────────────────── change family ──────────────────────────────
  - name: change.create
    family: change
    description: Create a continuous feature, fix, redesign, or incident change unit and its initial context manifest; incidents also register a five-section diagnosis artifact.
    phase: '9'
    writer_role: mcp
    input_schema:
      type: object
      required: [id, title, kind, intent]
      additionalProperties: false
      properties:
        id: { type: string, pattern: '^[a-zA-Z0-9_\-]+$' }
        title: { type: string, minLength: 3 }
        kind: { type: string, enum: [quick, standard, major, incident] }
        intent: { type: string, minLength: 3 }
        base_commit: { type: string, pattern: '^[0-9a-f]{7,40}$' }
        baseline_bypass:
          type: object
          required: [reason, approved_by]
          additionalProperties: false
          properties:
            reason: { type: string, minLength: 3 }
            approved_by: { type: string, minLength: 1 }
          description: incident-only break-glass approval when the project baseline is unhealthy
        docs_impact:
          type: object
          additionalProperties: false
          properties:
            status: { type: string, enum: [unknown, required, none] }
            files: { type: array, items: { type: string } }
            rationale: { type: ['string', 'null'] }
        provider_refs:
          type: object
          additionalProperties: false
          properties:
            memory:
              type: object
              required: [provider]
              additionalProperties: false
              properties:
                provider: { type: string }
                project: { type: string }
                reference: { type: string }
                revision: { type: string }
                indexed_head: { type: string }
                status: { type: string, enum: [available, unavailable, fresh, stale, unknown] }
            code_graph:
              type: object
              required: [provider]
              additionalProperties: false
              properties:
                provider: { type: string }
                project: { type: string }
                reference: { type: string }
                revision: { type: string }
                indexed_head: { type: string }
                status: { type: string, enum: [available, unavailable, fresh, stale, unknown] }
    output_schema:
      type: object
      required: [change, intent_path, context_manifest_path]
      additionalProperties: false
      properties:
        change: { type: object }
        intent_path: { type: string }
        context_manifest_path: { type: string }
    errors:
      - { code: DUPLICATE_CHANGE_ID, description: 'change id already exists' }
      - { code: PROVIDER_CONTENT_FORBIDDEN, description: 'provider payload content must remain external' }
      - { code: VALIDATION_ERROR, description: 'change input failed validation' }
      - { code: BASELINE_NOT_READY, description: 'ordinary work is blocked until the project baseline is healthy' }
      - { code: BASELINE_BYPASS_REQUIRED, description: 'an incident on an unhealthy baseline requires explicit break-glass approval' }
    cli_subcommand: change create
    emits_events: [change_created, context_updated]

  - name: change.update
    family: change
    description: Update change intent, documentation impact, external provider metadata, or active status.
    phase: '9'
    writer_role: mcp
    input_schema:
      type: object
      required: [id, patch]
      additionalProperties: false
      properties:
        id: { type: string }
        patch:
          type: object
          additionalProperties: false
          properties:
            title: { type: string, minLength: 3 }
            intent: { type: string, minLength: 3 }
            status: { type: string, enum: [active, blocked, cancelled] }
            docs_impact:
              type: object
              additionalProperties: false
              properties:
                status: { type: string, enum: [unknown, required, none] }
                files: { type: array, items: { type: string } }
                rationale: { type: ['string', 'null'] }
            provider_refs:
              type: object
              additionalProperties: false
              properties:
                memory:
                  type: object
                  required: [provider]
                  additionalProperties: false
                  properties:
                    provider: { type: string }
                    project: { type: string }
                    reference: { type: string }
                    revision: { type: string }
                    indexed_head: { type: string }
                    status: { type: string, enum: [available, unavailable, fresh, stale, unknown] }
                code_graph:
                  type: object
                  required: [provider]
                  additionalProperties: false
                  properties:
                    provider: { type: string }
                    project: { type: string }
                    reference: { type: string }
                    revision: { type: string }
                    indexed_head: { type: string }
                    status: { type: string, enum: [available, unavailable, fresh, stale, unknown] }
    output_schema:
      type: object
      required: [ok, change]
      additionalProperties: false
      properties:
        ok: { type: boolean }
        change: { type: object }
    errors:
      - { code: CHANGE_NOT_FOUND, description: 'change id does not exist' }
      - { code: CHANGE_NOT_MUTABLE, description: 'ready, archived, and cancelled changes are immutable' }
      - { code: ILLEGAL_CHANGE_TRANSITION, description: 'change transition is not permitted' }
      - { code: PROVIDER_CONTENT_FORBIDDEN, description: 'provider payload content must remain external' }
    cli_subcommand: change update
    emits_events: [change_updated]

  - name: change.get
    family: change
    description: Read one continuous change unit and its specification-learning candidates from authoritative state.
    phase: '9'
    readonly: true
    input_schema:
      type: object
      required: [id]
      additionalProperties: false
      properties:
        id: { type: string }
    output_schema:
      type: object
      required: [change]
      additionalProperties: false
      properties:
        change: { type: object }
    errors:
      - { code: CHANGE_NOT_FOUND, description: 'change id does not exist' }
    cli_subcommand: change get
    emits_events: []

  - name: change.list
    family: change
    description: List continuous changes by lifecycle status or change kind.
    phase: '9'
    readonly: true
    input_schema:
      type: object
      additionalProperties: false
      properties:
        status: { type: string, enum: [active, blocked, ready, archived, cancelled] }
        kind: { type: string, enum: [quick, standard, major, incident] }
        limit: { type: integer, minimum: 1, maximum: 500 }
    output_schema:
      type: object
      required: [changes, count]
      additionalProperties: false
      properties:
        changes: { type: array, items: { type: object } }
        count: { type: integer, minimum: 0 }
    errors:
      - { code: VALIDATION_ERROR, description: 'change filter failed validation' }
    cli_subcommand: change list
    emits_events: []

  - name: change.context
    family: change
    description: Compile a role-scoped Context Spine manifest with readiness, budget, execution seam, and next-action evidence.
    phase: '10'
    writer_role: mcp
    input_schema:
      type: object
      required: [id]
      additionalProperties: false
      properties:
        id: { type: string }
        task_id: { type: string }
        role: { type: string, enum: [plan, implement, check, review] }
        gate: { type: string, enum: [alignment, planning, implementation, verification, review, convergence, recovery] }
        next_action: { type: string, minLength: 3 }
        spec_refs: { type: array, items: { type: object } }
        context_refs:
          type: array
          maxItems: 64
          items:
            type: object
            required: [ref, reason]
            additionalProperties: false
            properties:
              ref: { type: string, minLength: 1 }
              kind: { type: string, enum: [spec, source, test, docs, external], default: source }
              reason: { type: string, minLength: 3 }
              required: { type: boolean, default: true }
              digest: { type: string, pattern: '^[0-9a-f]{64}$' }
        budget:
          type: object
          additionalProperties: false
          properties:
            max_tokens: { type: integer, minimum: 1, default: 12000 }
            max_files: { type: integer, minimum: 1, default: 12 }
        execution_contract:
          type: object
          additionalProperties: false
          properties:
            slice_kind: { type: string, enum: [tracer_bullet, expand_contract, integration_checkpoint], default: tracer_bullet }
            public_seam: { type: string }
            verification_command: { type: string }
            context_budget_percent: { type: integer, minimum: 1, maximum: 100, default: 40 }
        allowed_paths: { type: array, items: { type: string } }
        provider_refs:
          type: object
          additionalProperties: false
          properties:
            memory:
              type: object
              required: [provider]
              additionalProperties: false
              properties:
                provider: { type: string }
                project: { type: string }
                reference: { type: string }
                revision: { type: string }
                indexed_head: { type: string }
                status: { type: string, enum: [available, unavailable, fresh, stale, unknown] }
            code_graph:
              type: object
              required: [provider]
              additionalProperties: false
              properties:
                provider: { type: string }
                project: { type: string }
                reference: { type: string }
                revision: { type: string }
                indexed_head: { type: string }
                status: { type: string, enum: [available, unavailable, fresh, stale, unknown] }
    output_schema:
      type: object
      required: [manifest_path, manifest_hash, manifest]
      additionalProperties: false
      properties:
        manifest_path: { type: string }
        manifest_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
        manifest: { type: object }
    errors:
      - { code: VALIDATION_ERROR, description: 'context role, gate, references, budget, or execution contract is invalid' }
      - { code: CHANGE_NOT_FOUND, description: 'change id does not exist' }
      - { code: CHANGE_TERMINAL, description: 'terminal change cannot compile a new context' }
      - { code: TASK_NOT_FOUND, description: 'task id is not linked to the change' }
      - { code: PROVIDER_CONTENT_FORBIDDEN, description: 'provider payload content must remain external' }
    cli_subcommand: change context
    emits_events: [context_updated]

  - name: change.breadcrumb
    family: change
    description: Read the compact DB-derived Context Spine position, readiness, and single recommended next action.
    phase: '10'
    readonly: true
    writer_role: any
    input_schema:
      type: object
      additionalProperties: false
      properties:
        id: { type: string }
    output_schema:
      type: object
      required: [breadcrumb]
      additionalProperties: false
      properties:
        breadcrumb: { type: object }
    errors:
      - { code: CHANGE_NOT_FOUND, description: 'explicit change id does not exist' }
      - { code: STATE_DB_ERROR, description: 'runtime state could not be read' }
    cli_subcommand: change breadcrumb
    emits_events: []

  - name: change.learning_propose
    family: change
    description: Propose one stable implementation discovery for approval-gated baseline specification convergence.
    phase: '10'
    writer_role: mcp
    input_schema:
      type: object
      required: [change_id, target_ref, summary]
      additionalProperties: false
      properties:
        id: { type: string, pattern: '^[a-zA-Z0-9_\-]+$' }
        change_id: { type: string, pattern: '^[a-zA-Z0-9_\-]+$' }
        task_id: { type: string }
        target_ref: { type: string, minLength: 1 }
        summary: { type: string, minLength: 3 }
        evidence: { type: array, items: { type: string, minLength: 1 } }
    output_schema:
      type: object
      required: [candidate]
      additionalProperties: false
      properties:
        candidate: { type: object }
    errors:
      - { code: VALIDATION_ERROR, description: 'candidate id, target, summary, or evidence is invalid' }
      - { code: CHANGE_NOT_FOUND, description: 'change id does not exist' }
      - { code: CHANGE_NOT_MUTABLE, description: 'learning must resolve before convergence' }
      - { code: TASK_NOT_FOUND, description: 'task is not linked to the change' }
      - { code: DUPLICATE_LEARNING_ID, description: 'candidate id already exists' }
    cli_subcommand: change learning-propose
    emits_events: [spec_learning_proposed]

  - name: change.learning_resolve
    family: change
    description: Approve, reject, or mark applied one specification-learning candidate through a guarded state transition.
    phase: '10'
    writer_role: mcp
    input_schema:
      type: object
      required: [change_id, candidate_id, decision]
      additionalProperties: false
      properties:
        change_id: { type: string, pattern: '^[a-zA-Z0-9_\-]+$' }
        candidate_id: { type: string, pattern: '^[a-zA-Z0-9_\-]+$' }
        decision: { type: string, enum: [approve, reject, apply] }
        resolution: { type: string }
    output_schema:
      type: object
      required: [candidate]
      additionalProperties: false
      properties:
        candidate: { type: object }
    errors:
      - { code: VALIDATION_ERROR, description: 'decision or required resolution is invalid' }
      - { code: CHANGE_NOT_FOUND, description: 'change id does not exist' }
      - { code: LEARNING_NOT_FOUND, description: 'candidate id does not exist for the change' }
      - { code: ILLEGAL_LEARNING_TRANSITION, description: 'candidate state transition is not permitted' }
    cli_subcommand: change learning-resolve
    emits_events: [spec_learning_resolved]

  - name: change.converge
    family: change
    description: Deterministically verify task, spec, test, documentation, review, context, and incident diagnosis structure before closure.
    phase: '9'
    writer_role: mcp
    input_schema:
      type: object
      required: [id, evidence]
      additionalProperties: false
      properties:
        id: { type: string }
        evidence:
          type: array
          minItems: 1
          items:
            type: object
            required: [category, status, evidence]
            additionalProperties: false
            properties:
              category: { type: string, enum: [diagnosis, diff, tests, spec, docs, review] }
              status: { type: string, enum: [pass, fail, not_applicable] }
              evidence: { type: string, minLength: 3 }
              axis: { type: string, enum: [spec_fidelity, engineering_standards] }
              seam: { type: string, minLength: 3 }
              signal:
                type: object
                additionalProperties: false
                required: [command, expected_red, observed_red, observed_green, deterministic]
                properties:
                  command: { type: string, minLength: 3 }
                  expected_red: { type: string, minLength: 3 }
                  observed_red: { type: boolean }
                  observed_green: { type: boolean }
                  deterministic: { type: boolean }
                  duration_ms: { type: number, minimum: 0 }
    output_schema:
      type: object
      required: [ready, status, blockers]
      additionalProperties: false
      properties:
        ready: { type: boolean }
        status: { type: string, enum: [blocked, ready] }
        blockers: { type: array, items: { type: string } }
        verification_path: { type: string }
    errors:
      - { code: CHANGE_NOT_FOUND, description: 'change id does not exist' }
      - { code: CHANGE_NOT_CONVERGEABLE, description: 'change lifecycle does not allow convergence' }
    cli_subcommand: change converge
    emits_events: [change_blocked, change_converged]

  - name: change.archive
    family: change
    description: Archive a converged change after explicit baseline-spec reconciliation.
    phase: '9'
    writer_role: mcp
    input_schema:
      type: object
      required: [id, summary]
      additionalProperties: false
      properties:
        id: { type: string }
        summary: { type: string, minLength: 3 }
        baseline_updates: { type: array, items: { type: string } }
        no_baseline_change_reason: { type: string, minLength: 3 }
    output_schema:
      type: object
      required: [change, archive_path]
      additionalProperties: false
      properties:
        change: { type: object }
        archive_path: { type: string }
    errors:
      - { code: CHANGE_NOT_READY, description: 'change has not passed convergence' }
      - { code: BASELINE_RECONCILIATION_REQUIRED, description: 'baseline update or explicit no-change reason required' }
      - { code: BASELINE_FILE_MISSING, description: 'a declared baseline update does not exist' }
      - { code: BASELINE_RECONCILIATION_INCOMPLETE, description: 'repository revision or tracked specification digests remain stale after reconciliation' }
      - { code: ARCHIVE_EXISTS, description: 'archive target already exists' }
    cli_subcommand: change archive
    emits_events: [change_archived]

  # ────────────────────────── system family ──────────────────────────────
  - name: system.doctor
    family: system
    description: Inspect Ultra runtime health and optionally perform backup-first recovery and projection repair.
    phase: '9'
    writer_role: mcp
    input_schema:
      type: object
      additionalProperties: false
      properties:
        repair: { type: boolean, default: false }
    output_schema:
      type: object
      required: [status, checks, repair_performed]
      additionalProperties: true
      properties:
        status: { type: string, enum: [healthy, degraded] }
        checks: { type: object }
        repair_performed: { type: boolean }
        backup_path: { type: string }
        repair: { type: object }
    errors:
      - { code: BACKUP_FAILED, description: 'state database backup failed before repair' }
      - { code: STATE_DB_ERROR, description: 'runtime state could not be inspected' }
    cli_subcommand: system doctor
    emits_events: []

  # ────────────────────────── plan family (D34) ───────────────────────────
  - name: plan.export
    family: plan
    description: Render the current execution-plan artifact to disk (waves + ownership + conflict surface).
    phase: '8a'
    writer_role: mcp
    input_schema:
      type: object
      required: [out_path]
      additionalProperties: false
      properties:
        format:   { type: string, enum: [json, md], default: json }
        out_path: { type: string }
        tag:      { type: string }
    output_schema:
      type: object
      required: [plan_path, wave_count]
      additionalProperties: false
      properties:
        plan_path:  { type: string }
        wave_count: { type: integer, minimum: 0 }
    errors:
      - { code: NO_TASKS, description: 'no tasks to plan' }
      - { code: WRITE_FAILED, description: 'cannot write plan file' }
    cli_subcommand: plan export
    emits_events: [plan_approved]
    trace_to: '§7.3, D34'

  - name: plan.get
    family: plan
    description: Read a section of the current project's persisted .ultra/execution-plan.json artifact.
    phase: '8a'
    readonly: true
    input_schema:
      type: object
      additionalProperties: false
      properties:
        section: { type: string, enum: [tasks, topo, conflicts, all], default: all }
    output_schema:
      type: object
      required: [plan]
      additionalProperties: false
      properties:
        plan: { type: object }
    errors:
      - { code: NO_PLAN, description: 'no plan has been computed yet' }
    cli_subcommand: plan get
    emits_events: []
    trace_to: '§7.3, D34'
