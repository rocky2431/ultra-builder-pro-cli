<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Your agent, with the project in view.</title>
  <desc id="desc">You give the goal to your current coding agent. The agent uses Ultra Skills and project records to implement and verify the project. Delegated agents are optional and need your authorization.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.8" fill="#d5dfdb"/></pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M1 1 6 4 1 7" fill="none" stroke="#657e75" stroke-width="1.5"/></marker>
  </defs>
  <rect x="1" y="1" width="1198" height="518" rx="20" fill="#f5f8f6" stroke="#dce5df"/>
  <rect x="24" y="118" width="1152" height="380" fill="url(#grid)"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', Arial, sans-serif">
    <text x="44" y="45" font-size="14" font-weight="650" letter-spacing="2.5" fill="#537066">ULTRA BUILDER PRO</text>
    <text x="44" y="91" font-size="32" font-weight="650" fill="#16392f">Your agent, with the project in view.</text>
    <g fill="none" stroke="#657e75" stroke-width="2" marker-end="url(#arrow)">
      <path d="M244 220H310"/>
      <path d="M856 220H922"/>
      <path d="M588 303V338" marker-start="url(#arrow)"/>
      <path d="M866 270H894V412H922" stroke-dasharray="6 5" marker-start="url(#arrow)"/>
    </g>
    <rect x="44" y="150" width="200" height="140" rx="14" fill="#fff" stroke="#cddbd4"/>
    <circle cx="77" cy="182" r="7" fill="none" stroke="#658073" stroke-width="2"/>
    <path d="M66 202a11 11 0 0 1 22 0" fill="none" stroke="#658073" stroke-width="2"/>
    <text x="64" y="238" font-size="27" font-weight="650" fill="#16392f">You</text>
    <text x="64" y="267" font-size="17" fill="#52695f">Goal and constraints</text>
    <rect x="320" y="136" width="536" height="166" rx="16" fill="#173e32"/>
    <text x="348" y="180" font-size="29" font-weight="650" fill="#fff">Your coding agent</text>
    <text x="348" y="218" font-size="21" fill="#d1efdf">Chooses the approach and next step</text>
    <path d="M348 240H828" stroke="#46675a"/>
    <text x="348" y="271" font-size="17" fill="#b7d4c5">Claude Code · Codex · Pi · other hosts</text>
    <rect x="932" y="150" width="224" height="140" rx="14" fill="#e5f0e8" stroke="#b6cebf"/>
    <text x="954" y="193" font-size="26" font-weight="650" fill="#16392f">Your project</text>
    <text x="954" y="234" font-size="17" fill="#456352">Code you can use</text>
    <text x="954" y="262" font-size="17" fill="#456352">Results you can check</text>
    <text x="607" y="329" font-size="14" fill="#5a7467">read / maintain</text>
    <rect x="320" y="350" width="536" height="130" rx="14" fill="#fff" stroke="#cddbd4"/>
    <path d="M347 378h16l6 6h17v31h-39z" fill="#e8f1eb" stroke="#8fac9a" stroke-width="1.5"/>
    <text x="402" y="386" font-size="23" font-weight="650" fill="#16392f">Ultra Builder Pro</text>
    <text x="402" y="415" font-size="18" fill="#456352">Skills + project records</text>
    <text x="348" y="455" font-size="18" fill="#52695f">Requirements · decisions · tasks · evidence</text>
    <rect x="932" y="350" width="224" height="130" rx="14" fill="#f5f8f6" stroke="#9eb5a8" stroke-dasharray="6 5"/>
    <text x="954" y="387" font-size="23" font-weight="600" fill="#365448">Other agents</text>
    <text x="954" y="419" font-size="16" fill="#52695f">Only when authorized</text>
    <text x="954" y="452" font-size="16" fill="#52695f">Scoped work + review</text>
